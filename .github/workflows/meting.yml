name: Parkeerdata automatisch ophalen

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meting:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Benodigde package installeren
        run: pip install requests

      - name: Parkeerdata ophalen
        run: python scraper.py

      - name: Nieuwe meting opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parkeerdata.csv
          git diff --staged --quiet || git commit -m "Nieuwe parkeerdata"
          git push
